<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Shield -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="24 12" opacity="0.4" />
  
  <!-- Inner Circuit Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.6" />
  
  <!-- Center Energy Bolt Symbol -->
  <path d="M280 80 L140 280 L250 280 L230 432 L370 232 L260 232 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
