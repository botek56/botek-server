<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOTEK IoT | Devices</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=99999.0">
</head>
<body>

    <script src="i18n.js?v=1000.0"></script>
    <script src="auth.js?v=20260816_v10"></script>
    <script>
        checkLogin();
    </script>

    <!-- BLYNK NAVBAR -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
            <div class="logo-dot"></div>
            BOTEK IoT <span>CONSOLE</span>
        </div>

        <div class="nav-menu">
            <a href="index.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> <span data-i18n="nav_home">Beranda</span></a>
            <span class="divider"></span>
            <a href="devices.html" class="active"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg> <span data-i18n="nav_devices">Perangkat</span></a>
            <span class="divider"></span>
            <div class="user-area">
                <span id="navUsername" class="nav-username"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Loading...</span>
                <button type="button" onclick="logout()" data-i18n="nav_logout">Keluar</button>
            </div>
        </div>
    </nav>

    <!-- CONTAINER -->
    <div class="container">
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;">
            <div>
                <h1 data-i18n="nav_devices">Perangkat</h1>
                <p class="subtitle" data-i18n="my_devices_subtitle">Kelola dan pantau seluruh perangkat IoT terhubung</p>
            </div>
            <button onclick="addDevicePage()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> <span data-i18n="nav_add_device">+ Tambah Perangkat</span></button>
        </div>

        <div class="device-controls-header" style="margin-top: 10px;">
            <div style="font-size: 13px; font-weight: 700; color: var(--text-muted);" data-i18n="search_device_title">CARI PERANGKAT</div>
            <div class="filter-search-container">
                <div class="search-input-wrapper">
                    <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
                    <input type="text" id="searchInput" placeholder="Cari kode, nama perangkat, atau pemilik..." data-i18n-placeholder="search_device_ph" oninput="renderDevices()">
                </div>
            </div>
        </div>

        <div id="deviceList" class="device-grid"></div>
    </div>

    <script>
        let allDevices = [];

        function formatLastSeen(lastSeen) {
            if (!lastSeen) return "Never";
            const past = new Date(lastSeen).getTime();
            if (isNaN(past)) return lastSeen;
            const diffSec = Math.floor((Date.now() - past) / 1000);
            if (diffSec < 60) return "Just now";
            if (diffSec < 3600) return Math.floor(diffSec / 60) + "m ago";
            if (diffSec < 86400) return Math.floor(diffSec / 3600) + "h ago";
            return Math.floor(diffSec / 86400) + "d ago";
        }

        const unmaskedCodes = new Set();

        function maskCode(code) {
            if (!code) return "-";
            if (code.length <= 4) return "••••";
            return code.substring(0, 3) + "•".repeat(Math.max(5, code.length - 3));
        }

        function toggleMaskCode(code) {
            if (!code) return;
            if (unmaskedCodes.has(code)) {
                unmaskedCodes.delete(code);
            } else {
                unmaskedCodes.add(code);
            }
            renderDevices();
        }

        function renderDevices() {
            const container = document.getElementById("deviceList");
            if (!container) return;

            const query = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();
            const filtered = allDevices.filter(device => {
                return !query || 
                    (device.device_name && device.device_name.toLowerCase().includes(query)) ||
                    (device.device_code && device.device_code.toLowerCase().includes(query)) ||
                    (device.type && device.type.toLowerCase().includes(query)) ||
                    (device.owner_name && device.owner_name.toLowerCase().includes(query)) ||
                    (device.owner_username && device.owner_username.toLowerCase().includes(query));
            });

            let html = "";
            if (filtered.length === 0) {
                html = `
                <div class="card" style="grid-column: 1/-1; text-align: center; padding: 30px;">
                    <h2>${t("no_devices_found", "Tidak Ada Perangkat Ditemukan")}</h2>
                    <p style="color: var(--text-muted); font-size: 13px; margin-top: 6px;">${t("no_devices_desc", "Coba sesuaikan kata kunci pencarian Anda.")}</p>
                </div>
                `;
            } else {
                filtered.forEach(device => {
                    let icon = getDeviceIcon(device.type);
                    const isOnline = device.status === "ONLINE";
                    const statusBadge = isOnline 
                        ? `<span class="online"><span class="pulse-dot"></span> ${t("status_online", "ONLINE")}</span>`
                        : `<span class="offline">${t("status_offline", "OFFLINE")}</span>`;

                    const isUnmasked = unmaskedCodes.has(device.device_code);
                    const displayCode = isUnmasked ? device.device_code : maskCode(device.device_code);
                    const eyeIcon = isUnmasked 
                        ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
                        : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
                    const eyeTitle = isUnmasked ? t("hide_code", "Sembunyikan Kode") : t("show_code", "Lihat Kode");
                    const safeCode = (device.device_code || '').replace(/'/g, "\\'");

                    const ownerText = device.owner_name || device.owner_username || 'Admin';
                    const ownerBadge = `<span style="font-size: 11px; background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.25); padding: 1.5px 7px; border-radius: 6px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;">👤 ${ownerText}</span>`;

                    html += `
                    <div class="device-card">
                        <div>
                            <div class="device-card-header">
                                <div class="device-icon">${icon}</div>
                                <div>
                                    <h2>${device.device_name}</h2>
                                    <p class="device-type">${device.type || 'DEVICE'}</p>
                                </div>
                            </div>
                            <div class="device-info">
                                <p><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> ${t("owner_label", "Pemilik")}</span><b>${ownerBadge}</b></p>
                                <p><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg> ${t("device_code_label", "Kode Perangkat")}</span><span><b>${displayCode}</b><span class="eye-toggle-btn" title="${eyeTitle}" onclick="toggleMaskCode('${safeCode}')">${eyeIcon}</span></span></p>
                                <p><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> ${t("total_sensors_label", "Total Sensor")}</span><b>${device.sensor_count || 0} Unit</b></p>
                                <p><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${t("last_active_label", "Terakhir Aktif")}</span><b>${formatLastSeen(device.last_seen)}</b></p>
                            </div>
                            <div style="margin-bottom: 16px;">
                                ${statusBadge}
                            </div>
                        </div>
                        <div>
                            <button style="width: 100%;" onclick="openDevice('${safeCode}')">${t("open_dashboard_btn", "BUKA DASHBOARD ➔")}</button>
                            <button style="width: 100%; margin-top: 6px;" class="delete-btn" onclick="deleteDevice(${device.id})"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: text-bottom;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> ${t("delete_device_btn", "Hapus Unit")}</button>
                        </div>
                    </div>
                    `;
                });
            }
            container.innerHTML = html;
        }

        async function loadDevices() {
            try {
                const response = await fetch("/api/devices?_=" + Date.now());
                allDevices = await response.json();
                renderDevices();
            } catch (error) {
                console.error(error);
                const container = document.getElementById("deviceList");
                if (container) {
                    container.innerHTML = `<div class="card" style="grid-column: 1/-1;"><h2>Failed to Load Devices</h2><p>${error.message}</p></div>`;
                }
            }
        }

        function getDeviceIcon(type) {
            if (type === "Energy Monitor") return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>`;
            if (type === "Monitoring") return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-blue)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path></svg>`;
            if (type === "Relay") return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-purple)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`;
            return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line></svg>`;
        }

        function openDevice(code) {
            window.location.href = "device-dashboard.html?device=" + code;
        }

        function addDevicePage() {
            window.location.href = "add-device.html";
        }

        async function deleteDevice(id) {
            let yakin = await showConfirmModal({
                title: "Hapus Perangkat IoT?",
                message: "Apakah Anda yakin ingin menghapus perangkat ini beserta seluruh data sensor terkait?",
                icon: "🗑️",
                confirmText: "Ya, Hapus Perangkat",
                cancelText: "Batal",
                isDanger: true
            });
            if (!yakin) return;

            try {
                const response = await fetch("/api/devices/" + id, { method: "DELETE" });
                const result = await response.json();

                if (result.success) {
                    showToast("Device berhasil dihapus", "success");
                    loadDevices();
                } else {
                    showToast("Gagal menghapus device: " + (result.message || ""), "error");
                }
            } catch (err) {
                showToast("Gagal menghapus device dari server", "error");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadDevices();
            setInterval(loadDevices, 5000);
        });
    </script>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-status">
                <span class="pulse-dot"></span>
                <span>Real-Time MQTT & WebSocket Active</span>
            </div>
            <div class="footer-info">
                <span>BOTEK IoT Console v4.0</span>
                <span class="divider"></span>
                <span>&copy; 2026 BOTEK Cloud System</span>
            </div>
        </div>
    </footer>
</body>
</html>
