<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOTEK IoT | Device Control</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

    <div class="container">
        <h1>BOTEK Device Control</h1>
        <p class="subtitle">Kontrol cepat status saklar & relay</p>

        <div class="card" style="max-width: 500px; margin: auto;">
            <h2>Lamp Control</h2>
            <p id="lampStatus" style="font-size: 24px; margin: 20px 0; font-weight: 700;">🔴 Lamp OFF</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button onclick="lampOn()">TURN ON</button>
                <button onclick="lampOff()" class="delete-btn">TURN OFF</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
