<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOTEK IoT | Device Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260726_010500">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- AUTH CHECK -->
    <script src="i18n.js?v=1000.0"></script>
    <script src="auth.js?v=20260816_v9"></script>
    <script>
        checkLogin();
    </script>

    <!-- BLYNK NAVBAR -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
            <div class="logo-dot"></div>
            BOTEK IoT <span>CONSOLE</span>
        </div>

        <div class="nav-menu">
            <a href="index.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> Home</a>
            <span class="divider"></span>
            <a href="devices.html" class="active"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg> Devices</a>
            <span class="divider"></span>
            <div class="user-area">
                <span id="navUsername" class="nav-username"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Loading...</span>
                <button type="button" onclick="logout()" data-i18n="nav_logout">Keluar</button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <div class="container">
        
        <!-- DEVICE BANNER HEADER -->
        <div class="dashboard-banner">
            <div class="banner-title-area">
                <div class="banner-icon" id="bannerIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line></svg></div>
                <div>
                    <h1 id="deviceTitle" style="margin: 0; font-size: 24px;">Loading Device...</h1>
                    <div class="banner-meta" id="bannerMeta">
                        <span>Tipe: <b id="deviceType">-</b></span>
                        <span>•</span>
                        <span>Kode: <b id="deviceCodeVal">••••••••</b> <span class="eye-toggle-btn" id="dashEyeBtn" onclick="toggleDashCode()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></span></span>
                        <span>•</span>
                        <span id="deviceStatusBadge" class="online">● ONLINE</span>
                    </div>
                </div>
            </div>

            <div class="banner-actions">
                <button class="btn-primary" onclick="openAddMetricModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> <span data-i18n="btn_add_sensor">Tambah Sensor / Kontrol</span></button>
                <button class="btn-secondary" onclick="window.location.href='devices.html'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> <span data-i18n="back_to_devices">Kembali ke Perangkat</span></button>
                <button onclick="loadDashboard()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> <span data-i18n="refresh_btn">Segarkan</span></button>
            </div>
        </div>

        <!-- SENSOR CARD AREA -->
        <h2 class="section-title" id="sectionTitle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect></svg> <span data-i18n="sensor_title">Sensor Real-Time</span></h2>
        <div id="sensorDashboard" class="device-grid"></div>

        <!-- GRAPH SECTION -->
        <div id="graphSection" style="margin-top: 36px;">
            <h2 class="section-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-blue)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg> <span data-i18n="analytics_title">Analitik & Grafik Sensor</span></h2>

            <!-- GRAPH ADDER CONTROL BAR (Shown for Monitoring & Energy Monitor) -->
            <div id="graphControlBar" class="graph-controls-bar" style="display: none;">
                <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                    <span style="font-size: 13px; font-weight: 700; color: var(--blynk-green);" data-i18n="select_sensor">Pilih Sensor:</span>
                    <select id="graphSensorSelect"></select>
                    <button onclick="addNewGraphFromSelect()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> <span data-i18n="add_graph_btn">Tambah Grafik</span></button>
                </div>
            </div>

            <!-- DYNAMIC GRAPHS CONTAINER -->
            <div id="graphsContainer" class="graphs-grid"></div>
        </div>
    </div>

    <!-- ADD SENSOR / RELAY POPUP MODAL -->
    <div id="addMetricModal" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="max-width: 480px; width: 90%;">
            <div class="modal-header">
                <h3 style="display: flex; align-items: center; gap: 8px; margin: 0; font-size: 17px; color: #fff;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Tambah Sensor / Relay Baru
                </h3>
                <button type="button" class="modal-close-btn" onclick="closeAddMetricModal()">✖</button>
            </div>
            <div class="modal-body" style="padding: 20px 24px;">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Kategori / Tipe Komponen</label>
                    <select id="newMetricCategory" onchange="onMetricCategoryChange()" style="width: 100%; padding: 10px 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px;">
                        <option value="Relay">⚡ Relay Switch Controller (Sakelar ON/OFF)</option>
                        <option value="Dimmer">🎚️ Dimmer PWM / Speed Control (0-100%)</option>
                        <option value="Temperature">🌡️ Sensor Suhu (Temperature °C)</option>
                        <option value="Humidity">💧 Sensor Kelembaban (Humidity %)</option>
                        <option value="Voltage">⚡ Sensor Tegangan (Voltage V)</option>
                        <option value="Current">🔌 Sensor Arus (Current A)</option>
                        <option value="Power">💡 Sensor Daya (Power W)</option>
                        <option value="Energy">🔋 Sensor Energi (Energy kWh)</option>
                        <option value="Frequency">〰️ Sensor Frekuensi (Frequency Hz)</option>
                        <option value="Custom">📊 Sensor Kustom lainnya</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Nama Sensor / Relay</label>
                    <input type="text" id="newMetricName" placeholder="Masukkan nama sensor / relay" style="width: 100%; padding: 10px 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px;">
                </div>
                <div class="form-group" style="margin-bottom: 16px;" id="unitGroup">
                    <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Satuan / Unit (opsional)</label>
                    <input type="text" id="newMetricUnit" placeholder="°C, %, V, A, W, kWh" style="width: 100%; padding: 10px 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px;">
                </div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Nilai Awal (Initial Value)</label>
                    <input type="number" id="newMetricInitVal" value="0" placeholder="0" style="width: 100%; padding: 10px 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px;">
                </div>
            </div>
            <div class="modal-footer" style="padding: 16px 24px; display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--border-color);">
                <button type="button" class="btn-secondary" onclick="closeAddMetricModal()">Batal</button>
                <button type="button" class="btn-login" style="margin-top: 0; width: auto; padding: 10px 20px;" onclick="submitNewMetric()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Tambahkan Sekarang
                </button>
            </div>
        </div>
    </div>

    <!-- ADD SMART AUTOMATION RULE POPUP MODAL -->
    <div id="addRuleModal" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="max-width: 520px; width: 90%;">
            <div class="modal-header">
                <h3 style="display: flex; align-items: center; gap: 8px; margin: 0; font-size: 17px; color: #fff;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-amber)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                    Buat Aturan Otomasi Pintar
                </h3>
                <button type="button" class="modal-close-btn" onclick="closeAddRuleModal()">✖</button>
            </div>
            <div class="modal-body" style="padding: 20px 24px;">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Nama Aturan (Rule Name)</label>
                    <input type="text" id="ruleNameInput" placeholder="Masukkan nama aturan otomasi" style="width: 100%; padding: 10px 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px;">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px;">
                    <div class="form-group">
                        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Sensor Sumber</label>
                        <select id="ruleSensorSelect" style="width: 100%; padding: 9px 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 13px;"></select>
                    </div>
                    <div class="form-group">
                        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Operator</label>
                        <select id="ruleOperatorSelect" style="width: 100%; padding: 9px 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 13px;">
                            <option value=">">&gt; (Lebih Besar)</option>
                            <option value=">=">&gt;= (Lebih Besar Sama)</option>
                            <option value="<">&lt; (Lebih Kecil)</option>
                            <option value="<=">&lt;= (Lebih Kecil Sama)</option>
                            <option value="==">== (Sama Dengan)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Batas Ambang</label>
                        <input type="number" step="any" id="ruleThresholdInput" placeholder="Masukkan batas ambang (contoh: 6.0)" style="width: 100%; padding: 9px 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 13px;">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px;">
                    <div class="form-group">
                        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Target Relay</label>
                        <select id="ruleTargetRelaySelect" style="width: 100%; padding: 9px 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 13px;"></select>
                    </div>
                    <div class="form-group">
                        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted);">Aksi Otomatis</label>
                        <select id="ruleTargetActionSelect" style="width: 100%; padding: 9px 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 13px;">
                            <option value="ON">⚡ Nyalakan Relay (ON)</option>
                            <option value="OFF">🔴 Matikan Relay (OFF)</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="padding: 16px 24px; display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--border-color);">
                <button type="button" class="btn-secondary" onclick="closeAddRuleModal()">Batal</button>
                <button type="button" class="btn-login" style="margin-top: 0; width: auto; padding: 10px 20px;" onclick="submitNewRule()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Simpan Aturan Otomasi
                </button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD SCRIPT -->
    <script src="dashboard.js?v=20260815_034000"></script>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-status">
                <span class="pulse-dot"></span>
                <span>Real-Time MQTT & WebSocket Active</span>
            </div>
            <div class="footer-info">
                <span>BOTEK IoT Console v4.0</span>
                <span class="divider"></span>
                <span>&copy; 2026 BOTEK Cloud System</span>
            </div>
        </div>
    </footer>
</body>
</html>
