<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOTEK IoT | Add Device Template</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=999999.0">
</head>
<body>

    <script src="i18n.js?v=1000.0"></script>
    <script src="auth.js?v=20260816_v9"></script>
    <script>
        checkLogin();
    </script>

    <!-- BLYNK NAVBAR -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
            <div class="logo-dot"></div>
            BOTEK IoT <span>CONSOLE</span>
        </div>

        <div class="nav-menu">
            <a href="index.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> Home</a>
            <span class="divider"></span>
            <a href="devices.html" class="active"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg> Devices</a>
            <span class="divider"></span>
            <div class="user-area">
                <span id="navUsername" class="nav-username"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Loading...</span>
                <button type="button" onclick="logout()" data-i18n="nav_logout">Keluar</button>
            </div>
        </div>
    </nav>

    <!-- CONTENT CONTAINER -->
    <div class="container">
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;">
            <div>
                <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: text-bottom;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> <span data-i18n="nav_add_device">+ Tambah Perangkat</span></h1>
                <p class="subtitle" data-i18n="add_device_subtitle">Buat template perangkat IoT Universal dengan kombinasi Sensor & Sakelar Relay</p>
            </div>
            <button class="btn-secondary" onclick="window.location.href='devices.html'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> <span data-i18n="back_to_devices">Kembali ke Perangkat</span></button>
        </div>

        <div class="add-box card">
            <h2 style="font-size: 18px; margin-bottom: 20px; color: #ffffff;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> <span data-i18n="device_info_title">Informasi Perangkat</span></h2>
            
            <div class="device-form-grid">
                <div class="form-group">
                    <label style="display: flex; justify-content: space-between; align-items: center;">
                        <span data-i18n="device_code_label">Kode Perangkat</span>
                        <button type="button" onclick="generateRandomCode()" style="font-size: 11px; padding: 3px 9px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 6px; cursor: pointer; font-weight: 700;" data-i18n="random_code_btn">🎲 Acak Kode Unik</button>
                    </label>
                    <input id="device_code" placeholder="Masukkan kode perangkat (contoh: 01, 02)" data-i18n-placeholder="ph_device_code">
                </div>
                <div class="form-group">
                    <label data-i18n="device_name_label">Nama Perangkat</label>
                    <input id="device_name" placeholder="Masukkan nama perangkat" data-i18n-placeholder="ph_device_name">
                </div>
                <div class="form-group">
                    <label data-i18n="device_type_label">Kategori Perangkat</label>
                    <select id="device_type" onchange="changeDeviceType()">
                        <option value="Universal Controller" selected data-i18n="type_universal">Universal Hybrid (Sensor + Sakelar Relay)</option>
                        <option value="Energy Monitor" data-i18n="type_energy">Energy Monitor (Tegangan, Arus, Daya)</option>
                        <option value="Monitoring" data-i18n="type_env">Environmental Monitoring (Suhu, Kelembaban)</option>
                        <option value="Relay" data-i18n="type_relay">Relay / Switch Controller (Khusus Sakelar)</option>
                    </select>
                </div>
            </div>

            <!-- DYNAMIC SENSOR & RELAY CONFIGURATION -->
            <div id="sensorArea" style="margin-top: 24px;"></div>

            <div style="margin-top: 32px;">
                <button class="btn-login" style="margin-top: 0;" onclick="saveDevice()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> <span data-i18n="save_device_btn">SIMPAN TEMPLATE PERANGKAT</span>
                </button>
            </div>
        </div>
    </div>

    <!-- SENSOR PICKER POPUP MODAL -->
    <div id="sensorModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> Catalog & Pilih Sensor</h3>
                <button type="button" class="modal-close-btn" onclick="closeSensorModal()">✖</button>
            </div>
            <div style="padding: 14px 24px; border-bottom: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                <div class="search-input-wrapper" style="max-width: 280px;">
                    <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
                    <input type="text" id="modalSearchInput" placeholder="Cari nama sensor..." oninput="filterModalSensors()">
                </div>
                <div class="filter-btn-group">
                    <button type="button" class="filter-btn active" id="modalTabAll" onclick="setModalTab('ALL')">Semua</button>
                    <button type="button" class="filter-btn" id="modalTabEnergy" onclick="setModalTab('Energy Monitor')">Energy</button>
                    <button type="button" class="filter-btn" id="modalTabEnv" onclick="setModalTab('Monitoring')">Lingkungan</button>
                </div>
            </div>
            <div class="modal-body">
                <div id="modalSensorGrid" class="sensor-list"></div>
            </div>
            <div class="modal-footer">
                <span id="modalSelectedCount" style="font-size: 13px; font-weight: 700; color: var(--blynk-green);">0 Sensor Dipilih</span>
                <button type="button" onclick="closeSensorModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><polyline points="20 6 9 17 4 12"></polyline></svg> Simpan & Gunakan Sensor</button>
            </div>
        </div>
    </div>

    <script src="add-device.js?v=999999.0"></script>
</body>
</html>
