<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOTEK IoT | Console</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=999.0">
</head>
<body>

    <script src="i18n.js?v=1000.0"></script>
    <script src="auth.js?v=20260816_v10"></script>
    <script>
        checkLogin();
    </script>

    <!-- BLYNK NAVBAR -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
            <div class="logo-dot"></div>
            BOTEK IoT <span>CONSOLE</span>
        </div>

        <div class="nav-menu">
            <a href="index.html" class="active"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> Home</a>
            <span class="divider"></span>
            <a href="devices.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg> Devices</a>
            <span class="divider"></span>
            <div class="user-area">
                <span id="navUsername" class="nav-username"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Loading...</span>
                <button class="btn-logout-sm" onclick="logout()" data-i18n="nav_logout">Keluar</button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container">
        <div class="page-header">
            <h1>BOTEK IoT Console</h1>
            <p class="subtitle" data-i18n="console_subtitle">Sistem Manajemen & Kontrol Perangkat IoT Real-time</p>
        </div>

        <!-- SUMMARY CARDS -->
        <div class="summary-grid">
            <div class="summary-card">
                <h3><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-blue)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: text-bottom;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg> <span data-i18n="total_devices">Total Perangkat</span></h3>
                <h1 id="total">0</h1>
            </div>
            <div class="summary-card">
                <h3><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: text-bottom;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg> <span data-i18n="online_devices">Perangkat Terhubung</span></h3>
                <h1 id="online" class="online">0</h1>
            </div>
            <div class="summary-card">
                <h3><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: text-bottom;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> <span data-i18n="offline_devices">Perangkat Terputus</span></h3>
                <h1 id="offline" class="offline">0</h1>
            </div>
        </div>

        <div class="device-controls-header">
            <h2 class="section-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg> <span data-i18n="registered_devices">Daftar Perangkat Terdaftar</span></h2>
            <div class="filter-search-container">
                <div class="search-input-wrapper">
                    <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
                    <input type="text" id="searchInput" placeholder="Cari kode, nama perangkat, atau pemilik..." data-i18n-placeholder="search_device_ph" oninput="renderDevices()">
                </div>
            </div>
        </div>
        <div id="deviceList" class="device-grid"></div>
    </div>

    <script>
        let allDevices = [];

        async function loadUser() {
            try {
                const response = await fetch("/api/session");
                const data = await response.json();
                if (data.login && data.user) {
                    const userEl = document.getElementById("navUsername");
                    if (userEl) userEl.innerHTML = "👤 " + data.user.username;
                } else {
                    window.location.href = "login.html";
                }
            } catch(e) {
                console.error("Session check error", e);
            }
        }

        function formatLastSeen(lastSeen) {
            if (!lastSeen) return t("never_seen", "Belum Pernah");
            const past = new Date(lastSeen).getTime();
            if (isNaN(past)) return lastSeen;
            const diffSec = Math.floor((Date.now() - past) / 1000);
            if (diffSec < 60) return t("just_now", "Baru saja");
            if (diffSec < 3600) return Math.floor(diffSec / 60) + " " + t("ago_m", "m lalu");
            if (diffSec < 86400) return Math.floor(diffSec / 3600) + " " + t("ago_h", "j lalu");
            return Math.floor(diffSec / 86400) + " " + t("ago_d", "hr lalu");
        }

        const unmaskedCodes = new Set();

        function maskCode(code) {
            if (!code) return "-";
            if (code.length <= 4) return "••••";
            return code.substring(0, 3) + "•".repeat(Math.max(5, code.length - 3));
        }

        function toggleMaskCode(code) {
            if (!code) return;
            if (unmaskedCodes.has(code)) {
                unmaskedCodes.delete(code);
            } else {
                unmaskedCodes.add(code);
            }
            renderDevices();
        }

        function renderDevices() {
            const query = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();
            
            const filtered = allDevices.filter(device => {
                return !query || 
                    (device.device_name && device.device_name.toLowerCase().includes(query)) ||
                    (device.device_code && device.device_code.toLowerCase().includes(query)) ||
                    (device.owner_name && device.owner_name.toLowerCase().includes(query)) ||
                    (device.owner_username && device.owner_username.toLowerCase().includes(query));
            });

            let html = "";
            filtered.forEach(device => {
                const isOnline = device.status === "ONLINE";
                const statusBadge = isOnline 
                    ? `<span class="online"><span class="pulse-dot"></span> ${t("status_online", "ONLINE")}</span>`
                    : `<span class="offline">${t("status_offline", "OFFLINE")}</span>`;

                const isUnmasked = unmaskedCodes.has(device.device_code);
                const displayCode = isUnmasked ? device.device_code : maskCode(device.device_code);
                const eyeIcon = isUnmasked 
                    ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
                    : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
                const eyeTitle = isUnmasked ? t("hide_code", "Sembunyikan Kode") : t("show_code", "Lihat Kode");
                const safeCode = (device.device_code || '').replace(/'/g, "\\'");

                const ownerText = device.owner_name || device.owner_username || 'Admin';
                const ownerBadge = `<span style="font-size: 11px; background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.25); padding: 1.5px 7px; border-radius: 6px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;">👤 ${ownerText}</span>`;

                html += `
                <div class="device-card">
                    <div>
                        <div class="device-card-header">
                            <div class="device-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="15" x2="23" y2="15"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="15" x2="4" y2="15"></line></svg></div>
                            <div>
                                <h2>${device.device_name}</h2>
                            </div>
                        </div>
                        <div class="device-info">
                            <p><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> ${t("owner_label", "Pemilik")}</span><b>${ownerBadge}</b></p>
                            <p><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg> ${t("device_code_label", "Kode Perangkat")}</span><span><b>${displayCode}</b><span class="eye-toggle-btn" title="${eyeTitle}" onclick="toggleMaskCode('${safeCode}')">${eyeIcon}</span></span></p>
                            <p><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> ${t("total_sensors_label", "Total Sensor")}</span><b>${device.sensor_count || 0} Unit</b></p>
                            <p><span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${t("last_active_label", "Terakhir Aktif")}</span><b>${formatLastSeen(device.last_seen)}</b></p>
                        </div>
                        <div style="margin-bottom: 16px;">
                            ${statusBadge}
                        </div>
                    </div>
                    <button onclick="openDevice('${safeCode}')">${t("open_dashboard_btn", "BUKA DASHBOARD ➔")}</button>
                </div>
                `;
            });

            document.getElementById("deviceList").innerHTML = html || `
                <div class="card" style="grid-column: 1/-1; text-align: center; padding: 30px;">
                    <h3>${t("no_devices_found", "Tidak Ada Perangkat Ditemukan")}</h3>
                    <p style="color: var(--text-muted); font-size: 13px; margin-top: 6px;">${t("no_devices_desc", "Coba sesuaikan kata kunci pencarian Anda.")}</p>
                </div>
            `;
        }

        async function loadDevice() {
            try {
                const response = await fetch("/api/devices");
                allDevices = await response.json();

                let total = allDevices.length;
                let online = allDevices.filter(d => d.status === "ONLINE").length;

                document.getElementById("total").innerText = total;
                document.getElementById("online").innerText = online;
                document.getElementById("offline").innerText = total - online;

                renderDevices();

            } catch (error) {
                console.error("Error loading devices", error);
            }
        }

        function openDevice(code) {
            window.location.href = "device-dashboard.html?device=" + code;
        }

        loadUser();
        loadDevice();
        setInterval(loadDevice, 5000);
    </script>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-status">
                <span class="pulse-dot"></span>
                <span>Real-Time MQTT & WebSocket Active</span>
            </div>
            <div class="footer-info">
                <span>BOTEK IoT Console v4.0</span>
                <span class="divider"></span>
                <span>&copy; 2026 BOTEK Cloud System</span>
            </div>
        </div>
    </footer>
</body>
</html>
