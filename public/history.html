<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOTEK IoT | Sensor History</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4.0">
    <script src="i18n.js?v=1000.0"></script>
</head>
<body class="dark">

    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
            <div class="logo-dot"></div>
            BOTEK IoT <span>CONSOLE</span>
        </div>

        <div class="nav-menu">
            <a href="index.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> <span data-i18n="nav_home">Beranda</span></a>
            <span class="divider"></span>
            <a href="devices.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg> <span data-i18n="nav_devices">Perangkat</span></a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div>
                <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--blynk-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: text-bottom;"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> <span data-i18n="nav_history">Riwayat Log</span></h1>
                <p class="subtitle" data-i18n="history_subtitle">Log data dan riwayat telemetri sensor terdaftar</p>
            </div>
            <button class="btn-secondary" onclick="window.history.back()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> <span data-i18n="back_btn">Kembali</span></button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th data-i18n="time_col">Waktu</th>
                        <th data-i18n="temp_col">Suhu</th>
                        <th data-i18n="hum_col">Kelembaban</th>
                    </tr>
                </thead>
                <tbody id="historyTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadHistory() {
            try {
                const response = await fetch("/api/history");
                const data = await response.json();
                let table = document.getElementById("historyTable");
                table.innerHTML = "";

                data.forEach((item, index) => {
                    table.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${new Date(item.time).toLocaleTimeString()}</td>
                        <td>${item.temperature} °C</td>
                        <td>${item.humidity} %</td>
                    </tr>
                    `;
                });
            } catch(e) {
                console.error("Error loading history", e);
            }
        }
        loadHistory();
    </script>
</body>
</html>
